---
- name: Playbook 4 - Konfiguracja Serwera Zbojak
  hosts: 10.0.0.1
  gather_facts: no
  vars:
    nazwisko: "Zbojak"
    pass_default: "Student123!"

  tasks:
    - name: Instalacja Chocolatey
      chocolatey.chocolatey.win_chocolatey:
        name: chocolatey
        state: present

    - name: Instalacja 7zip i Firefox
      chocolatey.chocolatey.win_chocolatey:
        name: 
          - 7zip
          - firefox
        state: present

    - name: Instalacja narzędzia dig (bind-tool)
      chocolatey.chocolatey.win_chocolatey:
        name: bind-tool
        state: present
      ignore_errors: yes

    - name: Utworzenie grupy Kierownicy
      ansible.windows.win_group:
        name: "Kierownicy_{{ nazwisko }}"
        state: present

    - name: Utworzenie użytkowników
      ansible.windows.win_user:
        name: "{{ item }}"
        password: "{{ pass_default }}"
        state: present
        groups:
          - "Kierownicy_{{ nazwisko }}"
      loop:
        - "Marek Romanek"
        - "Jacek Gula"

    - name: Konfiguracja Puli Dyskowej i ReFS
      ansible.windows.win_shell: |
        $disks = Get-PhysicalDisk -CanPool $true
        if ($disks.Count -ge 4) {
            $pool = New-StoragePool -FriendlyName "Pula_{{ nazwisko }}" -StorageSubsystemFriendlyName "Windows Storage*" -PhysicalDisks $disks
            # Tworzenie dysku z Tieringiem (automatycznym) i Mirroringiem
            New-VirtualDisk -StoragePoolFriendlyName "Pula_{{ nazwisko }}" -FriendlyName "vDisk_{{ nazwisko }}" -ResiliencySettingName Mirror -UseMaximumSize
            # Formatowanie ReFS i litera F
            Get-VirtualDisk -FriendlyName "vDisk_{{ nazwisko }}" | Get-Disk | Initialize-Disk -PartitionStyle GPT -PassThru | New-Partition -AssignDriveLetter -UseMaximumSize | Format-Volume -FileSystem ReFS -NewFileSystemLabel "Dane"
            Set-Partition -DriveLetter (Get-Volume -FileSystemLabel "Dane").DriveLetter -NewDriveLetter F
        }
      args:
        creates: "F:\"

    - name: Tworzenie katalogu Projekty
      ansible.windows.win_file:
        path: F:\Projekty
        state: directory

    - name: Udostępnianie folderu
      ansible.windows.win_share:
        name: "Projekty_{{ nazwisko }}"
        path: F:\Projekty
        full: "Administrators, Kierownicy_{{ nazwisko }}"

    - name: Blokada usuwania drukarek dla nie-adminów
      ansible.windows.win_regedit:
        path: HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Printers
        name: NoDeletePrinter
        data: 1
        type: dword
        state: present
