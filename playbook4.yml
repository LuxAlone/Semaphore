---
- name: Playbook 4 - Konfiguracja Serwera Zbojak
  hosts: 10.0.0.1
  gather_facts: no
  vars:
    nazwisko: "Zbojak"
    pass_default: "Student123!"

  tasks:
    # ----------------------------------------------------------------
    # 1. Instalacja Oprogramowania (Poprawione nazwy pakietów)
    # ----------------------------------------------------------------
    - name: Instalacja Chocolatey
      chocolatey.chocolatey.win_chocolatey:
        name: chocolatey
        state: present

    - name: Instalacja aplikacji (7zip i Firefox)
      chocolatey.chocolatey.win_chocolatey:
        name: "{{ item }}"
        state: present
      loop:
        - 7zip.install
        - Firefox

    - name: Instalacja narzędzia dig (bind-tool)
      chocolatey.chocolatey.win_chocolatey:
        name: bind-tool
        state: present
      ignore_errors: yes # Jeśli repozytorium bind-tool ma problem, reszta przejdzie

    # ----------------------------------------------------------------
    # 2. Zarządzanie Użytkownikami i Grupą
    # ----------------------------------------------------------------
    - name: Utworzenie grupy Kierownicy_{{ nazwisko }}
      ansible.windows.win_group:
        name: "Kierownicy_{{ nazwisko }}"
        state: present

    - name: Utworzenie użytkowników
      ansible.windows.win_user:
        name: "{{ item.name }}"
        password: "{{ pass_default }}"
        state: present
        groups:
          - "Kierownicy_{{ nazwisko }}"
      loop:
        - { name: "Marek Romanek" }
        - { name: "Jacek Gula" }

    # ----------------------------------------------------------------
    # 3. Pula Dyskowa i ReFS (PowerShell)
    # ----------------------------------------------------------------
    - name: Konfiguracja Storage Pool, Mirroring i ReFS
      ansible.windows.win_shell: |
        $poolName = "Pula_{{ nazwisko }}"
        $vDiskName = "vDisk_{{ nazwisko }}"
        
        # 1. Pobranie dostępnych dysków (wszystkie 4)
        $disks = Get-PhysicalDisk -CanPool $true
        if ($disks.Count -ge 4) {
            # 2. Utworzenie Puli
            $pool = New-StoragePool -FriendlyName $poolName -StorageSubsystemFriendlyName "Windows Storage*" -PhysicalDisks $disks
            
            # 3. Utworzenie Wirtualnego Dysku (Mirror + Max Size)
            # Tiering w Windows Server automatycznie przypisuje SSD jako szybszą warstwę
            New-VirtualDisk -StoragePoolFriendlyName $poolName -FriendlyName $vDiskName -ResiliencySettingName Mirror -UseMaximumSize
            
            # 4. Inicjalizacja i formatowanie ReFS
            Get-VirtualDisk -FriendlyName $vDiskName | Get-Disk | Initialize-Disk -PartitionStyle GPT -PassThru | New-Partition -AssignDriveLetter -UseMaximumSize | Format-Volume -FileSystem ReFS -NewFileSystemLabel "Dane"
            
            # 5. Upewnienie się, że litera to F:
            $p = Get-Partition -DriveLetter (Get-Volume -FileSystemLabel "Dane").DriveLetter
            Set-Partition -InputObject $p -NewDriveLetter F
        }
      args:
        creates: "F:\" # Uruchom tylko jeśli dysk F nie istnieje

    # ----------------------------------------------------------------
    # 4. Udział Sieciowy i Uprawnienia
    # ----------------------------------------------------------------
    - name: Tworzenie katalogu Projekty
      ansible.windows.win_file:
        path: F:\Projekty
        state: directory

    - name: Udostępnianie folderu Projekty_{{ nazwisko }}
      ansible.windows.win_share:
        name: "Projekty_{{ nazwisko }}"
        path: F:\Projekty
        full: "Administrators,Kierownicy_{{ nazwisko }}"
        read: "" # Tylko uprawnieni mają dostęp

    # ----------------------------------------------------------------
    # 5. Rejestr - Blokada usuwania drukarek dla nie-adminów
    # ----------------------------------------------------------------
    - name: Blokada usuwania drukarek (Registry)
      ansible.windows.win_regedit:
        path: HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Printers
        name: NoDeletePrinter
        data: 1
        type: dword
        state: present
