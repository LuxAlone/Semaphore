---
- name: Instalacja i konfiguracja AdGuard Home
  hosts: agh_zbojak
  become: true

  vars:
    adg_vg: "adg_vg"
    adg_lv: "adg_lv"
    adg_mount: "/adguardhome"
    adg_url: "https://static.adguard.com/adguardhome/release/AdGuardHome_linux_amd64.tar.gz"
    adg_port: 3000

  tasks:

    - name: Tworzenie PV na sdb
      command: pvcreate /dev/sdb
      args:
        creates: "/dev/sdb"

    - name: Tworzenie PV na sdc
      command: pvcreate /dev/sdc
      args:
        creates: "/dev/sdc"

    - name: Tworzenie VG
      lvg:
        vg: "{{ adg_vg }}"
        pvs:
          - /dev/sdb
          - /dev/sdc

    - name: Pobranie dostępnego rozmiaru VG
      command: vgdisplay -C --noheadings -o vg_free --units m --nosuffix {{ adg_vg }}
      register: vg_free

    - name: Parsowanie rozmiaru VG (95% połowy dla RAID1)
      set_fact:
        vg_safe_mb: "{{ ((vg_free.stdout | trim | float / 2) * 0.95) | round(0) }}"

    - name: Tworzenie LV RAID1
      command: lvcreate -L {{ vg_safe_mb }}M -m1 -n {{ adg_lv }} {{ adg_vg }}
      args:
        creates: "/dev/{{ adg_vg }}/{{ adg_lv }}"

    - name: Tworzenie systemu plików
      filesystem:
        fstype: ext4
        dev: "/dev/{{ adg_vg }}/{{ adg_lv }}"

    - name: Tworzenie katalogu montowania
      file:
        path: "{{ adg_mount }}"
        state: directory
        mode: "0755"

    - name: Montowanie woluminu
      mount:
        path: "{{ adg_mount }}"
        src: "/dev/{{ adg_vg }}/{{ adg_lv }}"
        fstype: ext4
        state: mounted

    - name: Pobranie AdGuard Home
      get_url:
        url: "{{ adg_url }}"
        dest: "/tmp/adguard.tar.gz"

    - name: Rozpakowanie AdGuard Home
      unarchive:
        src: "/tmp/adguard.tar.gz"
        dest: "{{ adg_mount }}"
        remote_src: true

    - name: Instalacja binarki AdGuardHome
      copy:
        src: "{{ adg_mount }}/AdGuardHome/AdGuardHome"
        dest: "/usr/local/bin/AdGuardHome"
        mode: "0755"
        remote_src: true

    - name: Tworzenie katalogów konfiguracyjnych
      file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - /etc/AdGuardHome
        - /var/lib/AdGuardHome

    - name: Tworzenie usługi systemd
      copy:
        dest: /etc/systemd/system/adguardhome.service
        content: |
          [Unit]
          Description=AdGuard Home
          After=network.target

          [Service]
          Type=simple
          ExecStart=/usr/local/bin/AdGuardHome -c /etc/AdGuardHome/AdGuardHome.yaml -w /var/lib/AdGuardHome
          Restart=on-failure

          [Install]
          WantedBy=multi-user.target

    - name: Reload systemd
      command: systemctl daemon-reload

    - name: Start AdGuard Home
      systemd:
        name: adguardhome
        state: started
        enabled: true

    - name: Instalacja UFW
      apt:
        name: ufw
        state: present
        update_cache: yes

    - name: Reset UFW
      ufw:
        state: reset

    - name: Zezwolenie na SSH
      ufw:
        rule: allow
        port: 22
        proto: tcp

    - name: Zezwolenie na AdGuard Home
      ufw:
        rule: allow
        port: "{{ adg_port }}"
        proto: tcp

    - name: Włączenie UFW
      ufw:
       state: enabled

    - name: Autostart UFW
      systemd:
        name: ufw
        enabled: true
        state: started
