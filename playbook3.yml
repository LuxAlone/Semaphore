---
- name: Kopia zapasowa AdGuard Home
  hosts: agh_zbojak
  become: true

  vars:
    # Adres IP serwera backupowego
    backup_server: "10.0.0.2"

    # Ścieżka docelowa na serwerze backupowym
    backup_path: "/backups/adguardhome"

    # Data w formacie YYYY-MM-DD
    date: "{{ lookup('pipe', 'date +%Y-%m-%d') }}"

  tasks:

    - name: Tworzenie katalogu tymczasowego na backup
      file:
        path: "/tmp/adguard_backup_{{ date }}"
        state: directory
        mode: "0755"

    - name: Sprawdzenie czy istnieje plik konfiguracyjny
      stat:
        path: "/etc/AdGuardHome/AdGuardHome.yaml"
      register: adg_conf

    - name: Kopiowanie konfiguracji AdGuard Home (jeśli istnieje)
      copy:
        src: "/etc/AdGuardHome/AdGuardHome.yaml"
        dest: "/tmp/adguard_backup_{{ date }}/AdGuardHome.yaml"
        remote_src: true
      when: adg_conf.stat.exists

    - name: Archiwizacja danych AdGuard Home
      archive:
        path: "/var/lib/AdGuardHome"
        dest: "/tmp/adguard_backup_{{ date }}/data.tar.gz"

    - name: Wysyłanie backupu na serwer backupowy (rsync przez SSH)
      command: >
        rsync -avz /tmp/adguard_backup_{{ date }}/
        {{ backup_server }}:{{ backup_path }}/{{ date }}/

    - name: Usuwanie lokalnego katalogu tymczasowego
      file:
        path: "/tmp/adguard_backup_{{ date }}"
        state: absent
